name: market index

# Публикует каталог market/ (index.json + иконка) на GitHub Pages, чтобы
# пользователи могли добавить адрес индекса в разделе «Плагины → Обзор».
on:
  push:
    branches: [main]
    paths: ['market/**', 'site/**', 'icon.svg']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Пересобрать индекс из манифеста
        run: node tools/build-market.mjs
      - name: Собрать дашборд покрытия
        run: node tools/build-dashboard.mjs --out market/dashboard.html
      - name: Собрать фид обновлений
        run: node tools/build-updates.mjs
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp market/index.json market/history.json market/updates.json market/icon.svg _site/
          cp market/dashboard.html _site/dashboard.html
          cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
