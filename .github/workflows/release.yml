name: release

# Выпуск по тегу: версия берётся из имени тега, пакет собирается, проверяется и
# публикуется в npm.
#
# Публикация идёт через trusted publishing (OIDC): секреты не нужны, npm
# доверяет этому репозиторию и workflow. На npmjs.com в настройках пакета
# (Publishing access → Trusted publishing) укажите:
#   владелец: nemezida1337, репозиторий: dsh-locale-russian, workflow: release.yml
# Долгоживущие токены не используются: npm сворачивает токены с обходом 2FA для
# прямой публикации, а аттестация происхождения выдаётся по OIDC.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Собрать и проверить, но не публиковать'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs')
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            manifest.version = process.argv[1]
            fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          " "$VERSION"
          echo "версия: $VERSION"

      - name: Сборка и проверки
        run: |
          npm run lint
          npm run build
          npm run market
          npm run verify

      - name: Проверить, не опубликована ли версия
        if: startsWith(github.ref, 'refs/tags/v')
        id: published
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "dsh-locale-russian@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "версия $VERSION уже в реестре — публикация пропускается"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация
        # Оба условия явно привязаны к событию: на push-событии `inputs` пуст,
        # и `inputs.dry-run == false` вычисляется как true — так публикация
        # запускалась повторно и npm отвечал «cannot publish over».
        if: ${{ (github.event_name == 'push' && steps.published.outputs.exists != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false) }}
        run: npm publish --access public --provenance

      - name: Что ушло бы в реестр (сборка tarball)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm pack --dry-run

      - name: Подсказка при отказе публикации
        if: failure()
        shell: bash
        run: |
          cat <<'HINT'
          Публикация не прошла. Если в логе ENEEDAUTH — npm не увидел доверенного
          издателя. Проверьте на npmjs.com в настройках пакета:
            Publishing access → Trusted publishing:
              Publisher: GitHub Actions
              Organization or user: nemezida1337
              Repository: dsh-locale-russian
              Workflow filename: release.yml
              Environment name: пусто
              Allowed actions: отмечен "Allow npm publish"
          Связь с неверными полями изменить нельзя — удалите её и создайте заново.
          HINT

      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes \
            || echo 'релиз уже существует'
