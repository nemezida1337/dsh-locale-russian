name: checks

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Каждый день проверяем, не вышла ли новая версия DSH с новыми строками:
    # релизы выходят часто, а прогон занимает пару минут. GitHub не гарантирует
    # время планового запуска, поэтому недельное напоминание в сессии остаётся
    # вторым контуром слежения.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Линтер, сборка пакета и проверка собранного бандла. Зависимостей нет,
  # поэтому job быстрый и не требует установки DSH.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Линтер переводов
        run: npm run lint
      - name: Проверить индекс маркета официальным валидатором
        run: |
          npm install --no-save --no-package-lock @deepseek-ai/dsh-plugin-market-index
          node tools/validate-market.mjs
      - name: Сборка пакета
        run: npm run build
      - name: Индекс маркета
        run: npm run market
      - name: Проверка бандла
        run: npm run verify

  # Детектор обновлений: ставим свежий @deepseek-ai/dsh из npm, снимаем с него
  # словари и падаем, если появились непереведённые или переписанные строки.
  dsh-drift:
    # Установленный набор пакетов зависит от платформы: на Linux приезжают
    # linux-варианты системных бинарников, на Windows — свои. Проверяем обе,
    # иначе описания платформенных пакетов останутся английскими.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить свежий DSH
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh@latest
      - name: Снять строки и проверить дельту
        # Явный bash: на Windows PowerShell не понимает перенос строки через \.
        shell: bash
        run: |
          set -o pipefail
          node tools/refresh.mjs \
            --skip-asar --skip-repo \
            --packages node_modules/@deepseek-ai \
            --install-root node_modules/@deepseek-ai \
            --check 2>&1 | tee drift.log
      - name: Проверить предварительный релиз (тег next)
        # Приложение обновляется из канала next раньше, чем тег latest: так и
        # появилась сборка 0.2.1-rc.3, пока latest указывал на rc.2.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          LATEST=$(node -e "console.log(require('node_modules/@deepseek-ai/dsh/package.json').version)")
          NEXT=$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)
          if [ -z "$NEXT" ] || [ "$NEXT" = "$LATEST" ]; then
            echo "next совпадает с latest ($LATEST) — отдельная проверка не нужна"
            exit 0
          fi
          echo "next=$NEXT, latest=$LATEST — проверяем предварительный релиз"
          REPO="$PWD"
          mkdir -p /tmp/dsh-next && cd /tmp/dsh-next
          npm init -y > /dev/null
          npm install --no-save --no-package-lock "@deepseek-ai/dsh@$NEXT" > /dev/null
          cd "$REPO"
          node tools/refresh.mjs \
            --skip-asar --skip-repo \
            --packages /tmp/dsh-next/node_modules/@deepseek-ai \
            --install-root /tmp/dsh-next/node_modules/@deepseek-ai \
            --check 2>&1 | tee -a drift.log

      - name: Собрать отчёт о дельте
        if: failure()
        shell: bash
        run: |
          {
            echo '### Дельта перевода'
            echo
            echo 'Свежий `@deepseek-ai/dsh` из npm добавил или переписал строки.'
            echo
            echo '```'
            tail -40 drift.log
            echo '```'
            echo
            echo 'Дальше: `npm run refresh`, перевести `batches/p3-*.json` и `batches/plugin-*.json`,'
            echo 'затем `npm run mark-translated && npm test` и выпустить версию по тегу.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Открыть issue с дельтой
        # Недельный прогон — это и есть слежение: результат должен быть виден
        # в трекере, а не только в упавшем job-е.
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Новая версия DSH: появились строки для перевода'
        run: |
          {
            echo "Недельная проверка $(date -u +%Y-%m-%d) нашла расхождение с релизом DSH в npm."
            echo
            echo '```'
            tail -40 drift.log
            echo '```'
            echo
            echo 'Порядок действий: `npm run refresh` → перевести батчи → `npm run mark-translated` → `npm test` → `npm version patch && git push --follow-tags`.'
          } > issue.md
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
            echo "дополнен открытый issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi

  # Дымовой тест: поднимаем настоящий веб-сервер DSH с нашим пакетом через
  # строку патча и проверяем, что модуль попал в boot-граф страницы.
  smoke:
    # Вёрстка зависит от шрифтовых метрик системы: Linux уже находил обрезки,
    # которых нет на macOS, поэтому проверяем обе платформы.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить DSH
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh@latest
      - name: Установить Chrome для проверки вёрстки
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Поднять web-профиль с пакетом
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          mkdir -p "$DSH_HOME"
          npx --no-install dsh --profile web --dump-config > /dev/null
          PACK_URL=$(node -p "require('node:url').pathToFileURL(process.cwd() + '/lib/index.js').href")
          cat > "$DSH_HOME/profiles/web/cordis.patch.yml" <<YAML
          - insert:
              - id: locale-ru
                name: $PACK_URL
          YAML
          (npx --no-install dsh --profile web --port 5610 --no-open > web.log 2>&1 &)
          for _ in $(seq 1 40); do
            grep -q 'token=' web.log && break
            sleep 2
          done
          cat web.log
          TOKEN=$(grep -o 'token=[A-Za-z0-9_-]*' web.log | head -1 | cut -d= -f2)
          test -n "$TOKEN"
          curl -sL -c cookies.txt "http://127.0.0.1:5610/?token=$TOKEN" -o index.html
          grep -q 'dsh-locale-russian/client.js' index.html
          echo 'модуль языкового пакета попал в boot-граф'
      - name: Обход интерфейса (обрезка текста)
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          TOKEN=$(grep -o 'token=[A-Za-z0-9_-]*' web.log | head -1 | cut -d= -f2)
          node tools/gui-sweep.mjs --url "http://127.0.0.1:5610/?token=$TOKEN" --fail-on-clip
      - name: Сохранить снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-sweep
          path: reports/sweep
          if-no-files-found: ignore
