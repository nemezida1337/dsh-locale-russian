name: checks

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Каждый день проверяем, не вышла ли новая версия DSH с новыми строками:
    # релизы выходят часто, а прогон занимает пару минут. GitHub не гарантирует
    # время планового запуска, поэтому недельное напоминание в сессии остаётся
    # вторым контуром слежения.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Линтер, сборка пакета и проверка собранного бандла. Зависимостей нет,
  # поэтому job быстрый и не требует установки DSH.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна истории покрытия: она читает словари из тегов.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Официальный валидатор индекса
        # Нужен проверке живого индекса и validate-market.
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-plugin-market-index
      - name: Все проверки и тесты
        # Линтер, импорты, сборка, проверка бандла, документация, история покрытия
        # и все офлайн-наборы тестов инструментов.
        run: npm test
      - name: Индекс маркета официальным валидатором
        run: node tools/validate-market.mjs
      - name: Сборка индекса маркета
        run: npm run market

  # Детектор обновлений: ставим свежий @deepseek-ai/dsh из npm, снимаем с него
  # словари и падаем, если появились непереведённые или переписанные строки.
  dsh-drift:
    # Установленный набор пакетов зависит от платформы: на Linux приезжают
    # linux-варианты системных бинарников, на Windows — свои. Проверяем обе,
    # иначе описания платформенных пакетов останутся английскими.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить свежий DSH
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh@latest
      - name: Снять строки и проверить дельту
        id: delta
        # Явный bash: на Windows PowerShell не понимает перенос строки через \.
        shell: bash
        run: |
          set -o pipefail
          node tools/refresh.mjs \
            --skip-asar --skip-repo \
            --packages node_modules/@deepseek-ai \
            --install-root node_modules/@deepseek-ai \
            --check 2>&1 | tee drift.log
      - name: Проверить предварительные релизы (теги next и alpha)
        # Приложение и тестеры обновляются из каналов next и alpha раньше, чем из
        # latest: так появились сборки 0.2.1-rc.3 и 0.2.2-alpha.2, пока latest
        # указывал на более старую версию.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          LATEST=$(node -e "console.log(require('./node_modules/@deepseek-ai/dsh/package.json').version)")
          for TAG in next alpha; do
            PREVIEW=$(npm view "@deepseek-ai/dsh@$TAG" version 2>/dev/null || true)
            if [ -z "$PREVIEW" ] || [ "$PREVIEW" = "$LATEST" ]; then
              echo "$TAG совпадает с latest ($LATEST) — отдельная проверка не нужна"
              continue
            fi
            echo "$TAG=$PREVIEW, latest=$LATEST — проверяем предварительный релиз"
            DIR="/tmp/dsh-$TAG"
            REPO="$PWD"
            mkdir -p "$DIR" && cd "$DIR"
            npm init -y > /dev/null
            npm install --no-save --no-package-lock "@deepseek-ai/dsh@$PREVIEW" > /dev/null
            cd "$REPO"
            node tools/refresh.mjs \
              --skip-asar --skip-repo \
              --packages "$DIR/node_modules/@deepseek-ai" \
              --install-root "$DIR/node_modules/@deepseek-ai" \
              --check 2>&1 | tee -a drift.log
          done

      - name: Проверить живой индекс маркета
        id: market
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          node tools/market-live.mjs --retry 120 2>&1 | tee -a drift.log
      - name: Собрать отчёт о дельте
        if: failure()
        shell: bash
        run: |
          {
            echo '### Дельта перевода'
            echo
            echo 'Свежий `@deepseek-ai/dsh` из npm добавил или переписал строки.'
            echo
            echo '```'
            tail -40 drift.log
            echo '```'
            echo
            echo 'Дальше: `npm run refresh`, перевести `batches/p3-*.json` и `batches/plugin-*.json`,'
            echo 'затем `npm run mark-translated && npm test` и выпустить версию по тегу.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Открыть issue о дельте строк
        # Заголовок соответствует фактически упавшему шагу: иначе issue про
        # строки открывался и при сбое проверки живого индекса.
        if: steps.delta.outcome == 'failure' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Новая версия DSH: появились строки для перевода'
        run: |
          {
            echo "Проверка $(date -u +%Y-%m-%d) нашла расхождение строк с релизом DSH в npm."
            echo
            echo '```'
            tail -40 drift.log
            echo '```'
            echo
            echo 'Порядок действий: `npm run refresh` → перевести батчи → `npm run mark-translated` → `npm test` → `npm version patch && git push --follow-tags`.'
          } > issue.md
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
            echo "дополнен открытый issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
      - name: Открыть issue о живом индексе
        if: steps.market.outcome == 'failure' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Живой индекс маркета не совпадает с репозиторием'
        run: |
          {
            echo "Проверка $(date -u +%Y-%m-%d) не смогла подтвердить живой индекс маркета."
            echo
            echo '```'
            tail -40 drift.log
            echo '```'
            echo
            echo 'Проверьте: `npm run market:live` локально, деплой Pages и версию в `market/index.json`.'
          } > issue.md
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
            echo "дополнен открытый issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi

  # Дымовой тест: поднимаем настоящий веб-сервер DSH с нашим пакетом через
  # строку патча и проверяем, что модуль попал в boot-граф страницы.
  app-drift:
    # Проверяет покрытие на сборке, которую реально запускают пользователи:
    # обновление приложения приходит из публичного фида, архив сверяется по sha512.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Узнать версию приложения из фида
        id: feed
        shell: bash
        run: |
          curl -fsSL "https://download.deepseek.com/dsh-desk/feeds/mac-arm64/nightly-mac.yml" -o "$RUNNER_TEMP/feed.yml"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { parseFeed } from './tools/check-app.mjs'
            const feed = parseFeed(readFileSync(process.env.RUNNER_TEMP + '/feed.yml', 'utf8'))
            console.log('version=' + feed.version)
          " >> "$GITHUB_OUTPUT"
          echo "версия приложения: $(grep version= "$GITHUB_OUTPUT" | tail -1)"
      - name: Кэш app.asar
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-app-check
          key: dsh-app-${{ steps.feed.outputs.version }}
      - name: Проверить покрытие сборки приложения
        shell: bash
        run: |
          set -o pipefail
          node tools/check-app.mjs --work "$RUNNER_TEMP/dsh-app-check" --keep 2>&1 | tee drift.log
      - name: Отчёт в summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Дельта перевода в сборке приложения'
            echo
            echo '```'
            if [ -f drift.log ]; then tail -40 drift.log; else echo 'лог не создан'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Открыть issue с дельтой
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Новая версия приложения DSH: появились строки для перевода'
        run: |
          {
            echo "Проверка сборки приложения $(date -u +%Y-%m-%d) нашла расхождение."
            echo
            echo '```'
            if [ -f drift.log ]; then tail -40 drift.log; else echo 'лог не создан'; fi
            echo '```'
            echo
            echo 'Порядок: node tools/check-app.mjs → npm run refresh → перевести батчи → npm run mark-translated → npm test → выпуск по тегу.'
          } > issue.md
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi

  engine-smoke:
    # Сквозная проверка движка распознавания на платформах, где пакет не запускался
    # вживую: скачивает настоящий движок и модель, распознаёт тестовую запись.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Кэш движка и модели
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-engine-smoke
          key: engine-2.22.0-${{ matrix.os }}-v1
      - name: Сквозная проверка движка
        shell: bash
        run: |
          set -o pipefail
          node tools/engine-smoke.mjs --work "$RUNNER_TEMP/dsh-engine-smoke" --keep 2>&1 | tee engine-smoke.log
      - name: Отчёт в summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Проверка движка распознавания'
            echo
            echo '```'
            if [ -f engine-smoke.log ]; then tail -40 engine-smoke.log; else echo 'лог не создан'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Открыть issue при сбое
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Движок распознавания не работает на одной из платформ'
        run: |
          {
            echo "Проверка движка на ${{ matrix.os }} не прошла $(date -u +%Y-%m-%d)."
            echo
            echo '```'
            if [ -f engine-smoke.log ]; then tail -40 engine-smoke.log; else echo 'лог не создан'; fi
            echo '```'
          } > issue.md
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi

  smoke:
    # Вёрстка зависит от шрифтовых метрик системы: Linux уже находил обрезки,
    # которых нет на macOS, поэтому проверяем обе платформы.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить DSH
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh@latest
      - name: Установить Chrome для проверки вёрстки
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Поднять web-профиль с пакетом
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$PWD/.ci-home"
          mkdir -p "$DSH_HOME"
          npx --no-install dsh --profile web --dump-config > /dev/null
          PACK_URL=$(node -p "require('node:url').pathToFileURL(process.cwd() + '/lib/index.js').href")
          cat > "$DSH_HOME/profiles/web/cordis.patch.yml" <<YAML
          - insert:
              - id: locale-ru
                name: $PACK_URL
          YAML
          (npx --no-install dsh --profile web --port 5610 --no-open > web.log 2>&1 &)
          for _ in $(seq 1 40); do
            grep -q 'token=' web.log && break
            sleep 2
          done
          cat web.log
          TOKEN=$(grep -o 'token=[A-Za-z0-9_-]*' web.log | head -1 | cut -d= -f2)
          test -n "$TOKEN"
          curl -sL -c cookies.txt "http://127.0.0.1:5610/?token=$TOKEN" -o index.html
          grep -q 'dsh-locale-russian/client.js' index.html
          echo 'модуль языкового пакета попал в boot-граф'
      - name: Обход интерфейса (обрезка текста)
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          TOKEN=$(grep -o 'token=[A-Za-z0-9_-]*' web.log | head -1 | cut -d= -f2)
          node tools/gui-sweep.mjs --url "http://127.0.0.1:5610/?token=$TOKEN" --fail-on-clip
      - name: Сохранить снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-sweep
          path: reports/sweep
          if-no-files-found: ignore
